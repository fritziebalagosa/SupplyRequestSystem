<!DOCTYPE html>
<html>
<head>
    <title>Add Release Date Column</title>
</head>
<body>
    <h1>Adding Release Date Column</h1>
    <p>Click the button below to add the release_date column to the requests table:</p>
    <button onclick="addColumn()">Add Column</button>
    <div id="result"></div>

    <script>
        function addColumn() {
            fetch('add_column_ajax.php')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('result').innerHTML = '<h3>Result:</h3><pre>' + data + '</pre>';
                })
                .catch(error => {
                    document.getElementById('result').innerHTML = '<h3>Error:</h3><pre>' + error + '</pre>';
                });
        }
    </script>
</body>
</html>
